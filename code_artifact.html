<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>중소기업 발주·공정·정산 워크플로우 추적 웹앱</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }
    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-fade-in {
      animation: fadeSlideIn 0.2s ease-out forwards;
    }
    .dropzone-active {
      border-color: #2563eb !important;
      background-color: #eff6ff !important;
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen flex flex-col">

  <!-- 상단 내비게이션 헤더 -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-2xs">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-sm shrink-0">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
          </svg>
        </div>
      <!-- 우측: 현재 로그인 팀원(처리자) 전환, 사용자 관리 및 새 발주 등록 버튼 -->
      <div class="flex flex-wrap items-center gap-2.5">
        <div class="flex items-center gap-2 bg-slate-50 border border-slate-200 rounded-xl px-3 py-1.5">
          <span class="text-xs font-medium text-slate-500 shrink-0">현재 작업자:</span>
          <select id="currentUserSelect" class="bg-transparent text-xs sm:text-sm font-semibold text-slate-800 focus:outline-none cursor-pointer">
            <!-- JS로 옵션 렌더링 -->
          </select>
        </div>

        <button
          type="button"
          onclick="openUserModal()"
          class="inline-flex items-center gap-1.5 bg-white hover:bg-slate-50 active:bg-slate-100 text-slate-700 border border-slate-300 text-xs sm:text-sm font-semibold px-3.5 py-2 rounded-xl shadow-2xs transition cursor-pointer"
        >
          <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span>사용자 관리</span>
        </button>

        <button
          type="button"
          onclick="openNewOrderModal()"
          class="inline-flex items-center gap-1.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-xs sm:text-sm font-semibold px-4 py-2 rounded-xl shadow-sm transition cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
          </svg>
          <span>새 발주 등록</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 메인 콘텐츠 영역 -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 py-6 space-y-6">

    <!-- 1. 6단계 파이프라인 현황 카드 -->
    <section aria-label="단계별 업무 현황">
      <div class="flex items-center justify-between mb-2.5">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">단계별 진행 현황 (클릭하여 필터링)</h2>
        <button
          type="button"
          id="resetFilterBtn"
          onclick="selectStageFilter('ALL')"
          class="text-xs font-semibold text-blue-600 hover:text-blue-800 hidden cursor-pointer"
        >
          전체 단계 보기
        </button>
      </div>
      <div id="stageSummaryGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5 sm:gap-3">
        <!-- JS로 6단계 요약 카드 렌더링 -->
      </div>
    </section>

    <!-- 2. 검색 및 필터 바 -->
    <section class="bg-white border border-slate-200 rounded-2xl p-3.5 sm:p-4 shadow-2xs flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div class="relative flex-1">
        <svg class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2 pointer-events-none" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.35-4.35m0 0A7.5 7.5 0 1010.5 18a7.5 7.5 0 006.15-3.35z" />
        </svg>
        <input
          id="searchInput"
          type="text"
          placeholder="발주번호, 거래처명, 품목 또는 최근 처리자 검색..."
          oninput="handleSearchInput(this.value)"
          class="w-full pl-10 pr-4 py-2 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500 transition"
        />
      </div>

      <div class="flex items-center gap-2 flex-wrap">
        <button
          type="button"
          id="rejectedOnlyToggle"
          onclick="toggleRejectedOnly()"
          class="inline-flex items-center gap-1.5 px-3 py-2 rounded-xl text-xs font-semibold border border-slate-200 bg-white text-slate-700 hover:bg-slate-50 transition cursor-pointer"
        >
          <span class="w-2 h-2 rounded-full bg-rose-500"></span>
          <span>반려 복귀 건만 보기</span>
        </button>

        <div class="text-xs text-slate-500 px-2">
          표시 중: <strong id="visibleCountText" class="text-slate-800">0</strong>건
        </div>
      </div>
    </section>

    <!-- 3. 발주 및 공정 추적 리스트 -->
    <section aria-label="업무 목록">
      <div id="orderListContainer" class="space-y-3">
        <!-- JS로 업무 카드 리스트 렌더링 -->
      </div>
    </section>

  </main>

  <!-- 우측 슬라이드 상세 드로어 (단계 승인/반려 + 사진·파일 첨부 + 전체 로그 타임라인) -->
  <div
    id="detailDrawerBackdrop"
    class="fixed inset-0 bg-slate-900/40 backdrop-blur-xs z-40 hidden transition-opacity"
    onclick="closeDetailDrawer()"
  ></div>

  <aside
    id="detailDrawer"
    class="fixed top-0 right-0 h-full w-full max-w-2xl bg-white shadow-2xl border-l border-slate-200 z-50 transform translate-x-full transition-transform duration-200 ease-out flex flex-col"
    aria-hidden="true"
  >
    <!-- 드로어 상단 헤더 -->
    <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between gap-3 bg-slate-50/70">
      <div class="min-w-0">
        <div class="flex items-center gap-2 flex-wrap" id="drawerHeaderBadges"></div>
        <h2 id="drawerTitle" class="text-base sm:text-lg font-bold text-slate-900 truncate mt-1">발주 상세 정보</h2>
      </div>
      <button
        type="button"
        onclick="closeDetailDrawer()"
        class="p-2 rounded-xl text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 transition cursor-pointer shrink-0"
        aria-label="상세 패널 닫기"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- 드로어 본문 (스크롤 영역) -->
    <div id="drawerBody" class="flex-1 overflow-y-auto p-5 space-y-6">
      <!-- JS로 상세 정보, 승인/반려 액션, 파일 첨부, 타임라인 렌더링 -->
    </div>
  </aside>

  <!-- 새 발주 등록 모달 -->
  <div
    id="newOrderModal"
    class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4"
    onclick="if(event.target === this) closeNewOrderModal()"
  >
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-lg w-full overflow-hidden animate-fade-in max-h-[92vh] flex flex-col">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
        <h3 class="text-base font-bold text-slate-900">신규 발주 등록 (1단계 시작)</h3>
        <button
          type="button"
          onclick="closeNewOrderModal()"
          class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <form id="newOrderForm" onsubmit="submitNewOrder(event)" class="p-5 space-y-4 overflow-y-auto">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">거래처명 <span class="text-rose-500">*</span></label>
          <input id="newClientName" type="text" required placeholder="예: (주)성진정밀기계" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" />
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">품목 및 작업 요약 <span class="text-rose-500">*</span></label>
          <input id="newItemSummary" type="text" required placeholder="예: 알루미늄 브라켓 200EA CNC 가공" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" />
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">발주 금액 (원) <span class="text-rose-500">*</span></label>
            <input id="newAmount" type="number" min="0" step="1000" required placeholder="예: 4500000" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" />
          </div>
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">납기 희망일 <span class="text-rose-500">*</span></label>
            <input id="newDueDate" type="date" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500" />
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">발주 메모 (선택)</label>
          <textarea id="newNote" rows="2" placeholder="단가표 확인, 도면 버전, 특별 요청사항 등" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"></textarea>
        </div>

        <!-- 새 발주 등록 시 초기 사진/파일 첨부 영역 -->
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">발주 관련 사진 / 파일 첨부 (선택)</label>
          <div id="newOrderDropzone"></div>
        </div>

        <div class="pt-2 flex items-center justify-end gap-2 border-t border-slate-100">
          <button type="button" onclick="closeNewOrderModal()" class="px-4 py-2 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-50 text-sm font-semibold cursor-pointer">
            취소
          </button>
          <button type="submit" class="px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold shadow-sm cursor-pointer">
            발주 등록 완료
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 사용자 추가 및 삭제 관리 모달 -->
  <div
    id="userManageModal"
    class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4"
    onclick="if(event.target === this) closeUserModal()"
  >
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-xl w-full overflow-hidden animate-fade-in max-h-[90vh] flex flex-col">
      <div class="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-slate-50 shrink-0">
        <div>
          <h3 class="text-base font-bold text-slate-900">사용자 추가 및 삭제</h3>
          <p class="text-xs text-slate-500 mt-0.5">승인·반려 및 증빙 기록에 남을 팀원 계정을 관리합니다.</p>
        </div>
        <button
          type="button"
          onclick="closeUserModal()"
          class="p-1.5 rounded-lg text-slate-400 hover:text-slate-700 hover:bg-slate-200/60 cursor-pointer"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="p-5 space-y-5 overflow-y-auto">
        <!-- 새 사용자 추가 폼 -->
        <form id="addUserForm" onsubmit="submitNewUser(event)" class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-3">
          <div class="text-xs font-bold text-slate-800">새 사용자 추가</div>
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-2.5">
            <div>
              <label for="newUserName" class="block text-[11px] font-semibold text-slate-600 mb-1">이름 <span class="text-rose-500">*</span></label>
              <input
                id="newUserName"
                type="text"
                required
                placeholder="예: 강도현"
                class="w-full px-3 py-2 text-xs sm:text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label for="newUserDept" class="block text-[11px] font-semibold text-slate-600 mb-1">부서 <span class="text-rose-500">*</span></label>
              <input
                id="newUserDept"
                type="text"
                required
                placeholder="예: 품질관리팀"
                class="w-full px-3 py-2 text-xs sm:text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
            <div>
              <label for="newUserRole" class="block text-[11px] font-semibold text-slate-600 mb-1">역할·직책 <span class="text-rose-500">*</span></label>
              <input
                id="newUserRole"
                type="text"
                required
                placeholder="예: 검수·품질 담당"
                class="w-full px-3 py-2 text-xs sm:text-sm bg-white border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
            </div>
          </div>
          <div class="flex justify-end">
            <button
              type="submit"
              class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold shadow-2xs transition cursor-pointer"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4" />
              </svg>
              사용자 추가
            </button>
          </div>
        </form>

        <!-- 등록된 사용자 목록 및 삭제 -->
        <div class="space-y-2">
          <div class="flex items-center justify-between">
            <h4 class="text-xs font-bold text-slate-700">등록된 사용자 목록 (<span id="userCountText">0</span>명)</h4>
            <span class="text-[11px] text-slate-400">기존 로그의 처리자 기록은 유지됩니다.</span>
          </div>
          <div id="userListContainer" class="divide-y divide-slate-100 border border-slate-200 rounded-2xl bg-white overflow-hidden">
            <!-- JS로 사용자 목록 렌더링 -->
          </div>
        </div>
      </div>

      <div class="px-5 py-3 bg-slate-50 border-t border-slate-200 flex justify-end shrink-0">
        <button
          type="button"
          onclick="closeUserModal()"
          class="px-4 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold transition cursor-pointer"
        >
          닫기
        </button>
      </div>
    </div>
  </div>

  <!-- 이미지 라이트박스 / 파일 미리보기 모달 -->
  <div id="lightboxModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-xs z-50 hidden items-center justify-center p-4" onclick="if(event.target === this) closeLightbox()">
    <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-3xl w-full overflow-hidden animate-fade-in flex flex-col max-h-[90vh]">
      <div class="px-5 py-3.5 border-b border-slate-200 flex items-center justify-between gap-3 bg-slate-50">
        <div class="min-w-0">
          <h3 id="lightboxTitle" class="text-sm font-bold text-slate-900 truncate">파일 미리보기</h3>
          <p id="lightboxMeta" class="text-xs text-slate-500 truncate mt-0.5"></p>
        </div>
        <div class="flex items-center gap-2 shrink-0">
          <button type="button" id="lightboxDownloadBtn" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold cursor-pointer">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v2a2 2 0 002 2h12a2 2 0 002-2v-2M7 10l5 5 5-5M12 15V3" />
            </svg>
            다운로드
          </button>
          <button type="button" onclick="closeLightbox()" class="p-1.5 rounded-xl text-slate-500 hover:text-slate-900 hover:bg-slate-200/70 cursor-pointer" aria-label="미리보기 닫기">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
            </svg>
          </button>
        </div>
      </div>
      <div id="lightboxBody" class="p-5 overflow-y-auto flex-1 flex items-center justify-center bg-slate-900/5 min-h-[260px]">
        <!-- JS로 이미지 또는 문서 안내 렌더링 -->
      </div>
    </div>
  </div>

  <!-- 우측 하단 알림 토스트 컨테이너 -->
  <div id="toastContainer" class="fixed bottom-4 right-4 z-50 space-y-2 pointer-events-none"></div>

  <script>
    /**
     * =========================================================================
     * 1. 상수 및 마스터 데이터 정의 (6단계 공정 & 사용자 목록)
     * =========================================================================
     */
    const STAGES = [
      {
        step: 1,
        code: 'ORDERED',
        name: '발주',
        shortDesc: '발주 등록 및 내역 확정',
        badgeClass: 'bg-slate-100 text-slate-700 border border-slate-300',
        activeCardClass: 'ring-2 ring-slate-700 bg-slate-50',
        dotClass: 'bg-slate-600',
      },
      {
        step: 2,
        code: 'IN_PROGRESS',
        name: '진행중',
        shortDesc: '제작·가공·입고 공정 진행',
        badgeClass: 'bg-blue-50 text-blue-700 border border-blue-200',
        activeCardClass: 'ring-2 ring-blue-600 bg-blue-50/50',
        dotClass: 'bg-blue-600',
      },

    /**
     * =========================================================================
     * 3. 유틸리티 함수
     * =========================================================================
     */
    function getStageInfo(step) {
      return STAGES.find((s) => s.step === Number(step)) || STAGES[0];
    }

    function getCurrentUser() {
      return state.users.find((u) => u.id === state.currentUserId) || state.users[0];
    }

    function formatCurrency(amount) {
      return new Intl.NumberFormat('ko-KR').format(Number(amount || 0)) + '원';
    }

    function formatFileSize(bytes) {
      if (!bytes || bytes <= 0) return '0 KB';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
    }

    function formatNowTimestamp() {
      const now = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      const yyyy = now.getFullYear();
      const mm = pad(now.getMonth() + 1);
      const dd = pad(now.getDate());
      const hh = pad(now.getHours());
      const min = pad(now.getMinutes());
      return `${yyyy}-${mm}-${dd} ${hh}:${min}`;
    }

    function getDefaultFutureDate(daysAhead = 7) {
      const d = new Date();
      d.setDate(d.getDate() + daysAhead);
      return d.toISOString().split('T')[0];
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    function getAllAttachments(order) {
      const list = [];
      (order.logs || []).forEach((log) => {
        (log.attachments || []).forEach((att) => {
          list.push({
            ...att,
            logId: log.id,
            action: log.action,
            step: att.step || log.toStep,
            uploadedBy: att.uploadedBy || log.actorName,
            uploadedAt: att.uploadedAt || log.timestamp,
          });
        });
      });
      return list;
    }

    function showToast(message, type = 'info') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      const colorMap = {
        info: 'bg-slate-900 text-white border-slate-700',
        success: 'bg-emerald-700 text-white border-emerald-600',
        warn: 'bg-rose-700 text-white border-rose-600',
      };
      toast.className = `pointer-events-auto border px-4 py-3 rounded-xl shadow-lg text-xs sm:text-sm font-medium flex items-center gap-2 animate-fade-in ${colorMap[type] || colorMap.info}`;
      toast.innerHTML = `<span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transition = 'opacity 0.25s ease';
        setTimeout(() => toast.remove(), 250);
      }, 2800);
    }

                    <div class="flex items-center gap-2 min-w-0">
                      ${
                        f.isImage
                          ? `<img src="${f.url}" alt="${escapeHtml(f.name)}" class="w-9 h-9 rounded-lg object-cover border border-slate-200 shrink-0" />`

                               FILE

      return `
        <div>

    function refreshDropzone(zoneKey) {
      if (zoneKey === 'newOrder') {
        const el = document.getElementById('newOrderDropzone');
        if (el) el.innerHTML = renderDropzoneHtml('newOrder', '발주서·도면·현장 사진 첨부');
      } else if (state.activeOrderId) {
        renderDrawerContent(state.activeOrderId);
      }
    }

    function processSelectedFiles(fileList, zoneKey) {
      if (!fileList || fileList.length === 0) return;
      const filesArray = Array.from(fileList);

      filesArray.forEach((file) => {
        const isImage = file.type.startsWith('image/');
        const reader = new FileReader();
        reader.onload = (e) => {
          state.pendingFiles[zoneKey].push({
            id: `att-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            name: file.name,
            size: file.size,
            mimeType: file.type || 'application/octet-stream',
            isImage,
            url: e.target.result,
          });
          refreshDropzone(zoneKey);
        };
        reader.readAsDataURL(file);
      });
    }

    function handleFileInputChange(event, zoneKey) {
      processSelectedFiles(event.target.files, zoneKey);
      event.target.value = '';
    }

    function handleDropFiles(event, zoneKey, el) {
      event.preventDefault();
      if (el) el.classList.remove('dropzone-active');
      if (event.dataTransfer && event.dataTransfer.files) {
        processSelectedFiles(event.dataTransfer.files, zoneKey);
      }
    }

    function removePendingFile(zoneKey, index) {
      state.pendingFiles[zoneKey].splice(index, 1);
      refreshDropzone(zoneKey);
    }

    function consumePendingFiles(zoneKey, user, step) {
      const items = state.pendingFiles[zoneKey] || [];
      const now = formatNowTimestamp();
      const formatted = items.map((item) => ({
        ...item,
        uploadedBy: user.name,
        uploadedAt: now,
        step,
      }));
      state.pendingFiles[zoneKey] = [];
      return formatted;
    }

      const order = state.orders.find((o) => o.id === orderId);
      if (!order) return;
      const allAtts = getAllAttachments(order);
      const att = allAtts.find((a) => a.id === attachmentId);
      if (!att) return;

      const stageInfo = getStageInfo(att.step);
      document.getElementById('lightboxTitle').textContent = att.name;
      document.getElementById('lightboxMeta').textContent = `${att.step}단계(${stageInfo.name}) · 업로더: ${att.uploadedBy} · ${att.uploadedAt} (${formatFileSize(att.size)})`;

      const dlBtn = document.getElementById('lightboxDownloadBtn');
      dlBtn.onclick = () => triggerDownload(att.url, att.name);

      const body = document.getElementById('lightboxBody');
      if (att.isImage) {
        body.innerHTML = `<img src="${att.url}" alt="${escapeHtml(att.name)}" class="max-h-[65vh] max-w-full rounded-xl shadow-md object-contain" />`;
      } else {
        body.innerHTML = `

            >
              파일 다운로드
            </button>
          </div>

        if (bodyDlBtn) {
          bodyDlBtn.onclick = () => triggerDownload(att.url, att.name);

    }

    function closeLightbox() {
      const modal = document.getElementById('lightboxModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function triggerDownload(url, filename) {
      const a = document.createElement('a');
      a.href = url;
      a.download = filename || 'download';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    function downloadAttachmentById(orderId, attachmentId) {
      const order = state.orders.find((o) => o.id === orderId);
      if (!order) return;
      const att = getAllAttachments(order).find((a) => a.id === attachmentId);
      if (!att) return;
      triggerDownload(att.url, att.name);
    }

      select.innerHTML = state.users

        if (user) {
          showToast(`작업자가 '${user.name} (${user.role})'(으)로 전환되었습니다.`);

        if (state.activeOrderId) {
          renderDrawerContent(state.activeOrderId);
        }
      };

    function submitNewUser(event) {
      event.preventDefault();
      const name = document.getElementById('newUserName').value.trim();
      const dept = document.getElementById('newUserDept').value.trim();
      const role = document.getElementById('newUserRole').value.trim();

      if (!name || !dept || !role) return;

      const newUser = {
        id: `u-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
        name,
        dept,
        role,
      };

      state.users.push(newUser);
      state.currentUserId = newUser.id;
      renderUserSelector();
      renderUserManageList();
      if (state.activeOrderId) {
        renderDrawerContent(state.activeOrderId);
      }
      document.getElementById('addUserForm').reset();
      showToast(`'${name}' 사용자가 추가되고 현재 작업자로 선택되었습니다.`, 'success');
    }

    function handleDeleteUser(userId) {
      if (state.users.length <= 1) {
        showToast('최소 1명 이상의 사용자가 필요합니다.', 'warn');
        return;
      }

      const target = state.users.find((u) => u.id === userId);
      if (!target) return;

      state.users = state.users.filter((u) => u.id !== userId);
      if (state.currentUserId === userId) {
        state.currentUserId = state.users[0].id;
      }

      renderUserSelector();
      renderUserManageList();
      if (state.activeOrderId) {
        renderDrawerContent(state.activeOrderId);
      }
      showToast(`'${target.name}' 사용자가 삭제되었습니다.`, 'info');
    }

            </div>
          </button>
        `;
      }).join('');

    function getFilteredOrders() {
      const q = state.searchQuery.trim().toLowerCase();
      return state.orders.filter((order) => {
        if (state.selectedStep !== 'ALL' && order.currentStep !== Number(state.selectedStep)) {
          return false;
        }
        if (state.rejectedOnly && !order.isRejectedReturn) {
          return false;
        }
        if (!q) return true;

        const lastLog = order.logs[order.logs.length - 1];
        const haystack = [
          order.orderNo,
          order.clientName,
          order.itemSummary,
          lastLog ? lastLog.actorName : '',
        ]
          .join(' ')
          .toLowerCase();

        return haystack.includes(q);
      });
    }

        .map((order) => {

          const progressPercent = Math.round((order.currentStep / 6) * 100);
          const totalFilesCount = getAllAttachments(order).length;

          return `
            <article
              onclick="openDetailDrawer('${escapeHtml(order.id)}')"
              class="bg-white border ${
                order.isRejectedReturn ? 'border-rose-300 ring-1 ring-rose-100' : 'border-slate-200'
              } hover:border-blue-400 rounded-2xl p-4 sm:p-5 shadow-2xs hover:shadow-md transition cursor-pointer group"
            >
              <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                <!-- 좌측: 발주번호, 거래처, 품목, 반려 배지 -->
                <div class="space-y-1.5 min-w-0 flex-1">
                  <div class="flex flex-wrap items-center gap-2">
                    <span class="text-xs font-mono font-semibold text-slate-500 bg-slate-100 px-2 py-0.5 rounded-md">
                      ${escapeHtml(order.orderNo)}
                    </span>
                    <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${stage.badgeClass}">
                      ${order.currentStep}단계 · ${escapeHtml(stage.name)}
                    </span>
                    ${
                      totalFilesCount > 0
                        ? `<span class="inline-flex items-center gap-1 text-xs font-semibold px-2 py-0.5 rounded-full bg-slate-100 text-slate-700 border border-slate-200" title="첨부된 사진/문서 ${totalFilesCount}개">
                             <svg class="w-3.5 h-3.5 text-blue-600" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                               <path stroke-linecap="round" stroke-linejoin="round" d="M15.172 7l-6.586 6.586a2 2 0 102.828 2.828l6.414-6.586a4 4 0 00-5.656-5.656l-6.415 6.585a6 6 0 108.486 8.486L20.5 13" />
                             </svg>
                             ${totalFilesCount}
                           </span>`
                        : ''
                    }
                    ${
                      order.isRejectedReturn
                        ? `<span class="inline-flex items-center gap-1 text-xs font-bold px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700 border border-rose-200">
                             반려 복귀 · 재확인 필요
                           </span>`
                        : ''
                    }
                  </div>

                  <div class="flex flex-col sm:flex-row sm:items-baseline gap-1 sm:gap-2.5">
                    <h3 class="text-sm sm:text-base font-bold text-slate-900 group-hover:text-blue-600 transition truncate">
                      [${escapeHtml(order.clientName)}] ${escapeHtml(order.itemSummary)}
                    </h3>
                    <span class="text-xs font-semibold text-slate-500 shrink-0">
                      ${formatCurrency(order.amount)} · 납기 ${escapeHtml(order.dueDate)}
                    </span>
                  </div>

                  ${
                    order.isRejectedReturn && order.lastRejectionReason
                      ? `<p class="text-xs text-rose-700 bg-rose-50 border border-rose-200/80 rounded-xl px-3 py-1.5 mt-1">
                           <strong>반려 사유:</strong> ${escapeHtml(order.lastRejectionReason)}
                         </p>`
                      : ''
                  }
                </div>

                <!-- 우측: 6단계 진행 바 + 최근 승인/처리자 정보 -->
                <div class="lg:w-72 shrink-0 flex flex-col justify-between gap-2 border-t lg:border-t-0 pt-3 lg:pt-0 border-slate-100">
                  <div>
                    <div class="flex items-center justify-between text-[11px] font-semibold text-slate-500 mb-1">
                      <span>공정 진행률 (${order.currentStep}/6단계)</span>
                      <span>${progressPercent}%</span>
                    </div>
                    <div class="flex items-center gap-1">
                      ${miniStepsHtml}
                    </div>
                  </div>

                  <div class="flex items-center justify-between text-xs text-slate-500">
                    <span>
                      최근 처리: <strong class="text-slate-800">${lastLog ? escapeHtml(lastLog.actorName) : '-'}</strong>
                    </span>
                    <span class="text-[11px] text-slate-400">${lastLog ? escapeHtml(lastLog.timestamp) : ''}</span>
                  </div>
                </div>
              </div>
            </article>
          `;
        })
        .join('');
    }

    function renderAll() {
      renderStageSummary();
      renderOrderList();
      if (state.activeOrderId) {
        renderDrawerContent(state.activeOrderId);
      }
    }

    /**
     * =========================================================================
     * 5. 상세 드로어 & 승인/반려 처리
     * =========================================================================
     */
    function openDetailDrawer(orderId) {
      state.activeOrderId = orderId;
      state.drawerTab = 'timeline';
      state.pendingFiles.approve = [];
      state.pendingFiles.reject = [];
      state.pendingFiles.standalone = [];
      renderDrawerContent(orderId);

      const backdrop = document.getElementById('detailDrawerBackdrop');
      const drawer = document.getElementById('detailDrawer');
      backdrop.classList.remove('hidden');
      requestAnimationFrame(() => {
        drawer.classList.remove('translate-x-full');
        drawer.setAttribute('aria-hidden', 'false');
      });
    }

    function switchDrawerTab(tab) {
      state.drawerTab = tab;
      if (state.activeOrderId) {
        renderDrawerContent(state.activeOrderId);
      }
    }

    function closeDetailDrawer() {
      state.activeOrderId = null;
      const backdrop = document.getElementById('detailDrawerBackdrop');
      const drawer = document.getElementById('detailDrawer');
      drawer.classList.add('translate-x-full');
      drawer.setAttribute('aria-hidden', 'true');
      setTimeout(() => {
        backdrop.classList.add('hidden');
      }, 200);
    }

    function renderDrawerContent(orderId) {
      const order = state.orders.find((o) => o.id === orderId);
      if (!order) return;

      const stage = getStageInfo(order.currentStep);
      const nextStage = order.currentStep < 6 ? getStageInfo(order.currentStep + 1) : null;
      const currentUser = getCurrentUser();

      document.getElementById('drawerHeaderBadges').innerHTML = `
        <span class="text-xs font-mono font-semibold text-slate-600 bg-slate-200/70 px-2 py-0.5 rounded-md">
          ${escapeHtml(order.orderNo)}
        </span>
        <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${stage.badgeClass}">
          현재 ${order.currentStep}단계 · ${escapeHtml(stage.name)}
        </span>
        ${
          order.isRejectedReturn
            ? `<span class="text-xs font-bold px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-700 border border-rose-200">반려 복귀</span>`
            : ''
        }
      `;
      document.getElementById('drawerTitle').textContent = `[${order.clientName}] ${order.itemSummary}`;

      const allAttachments = getAllAttachments(order);

      const prevStageOptions = [];
      for (let s = order.currentStep - 1; s >= 1; s--) {
        const info = getStageInfo(s);
        prevStageOptions.push(
          `<option value="${s}">${s}단계 · ${escapeHtml(info.name)}${
            s === order.currentStep - 1 ? ' (직전 단계)' : ''
          }</option>`
        );
      }

      let actionCardHtml = '';
      if (order.currentStep < 6) {
        actionCardHtml = `
          <div class="bg-slate-50 border border-slate-200 rounded-2xl p-4 space-y-4">
            <div class="flex items-center justify-between flex-wrap gap-2">
              <h3 class="text-sm font-bold text-slate-900">단계 승인 및 반려 처리</h3>
              <span class="text-xs text-slate-500">
                처리자: <strong class="text-blue-700">${escapeHtml(currentUser.name)}</strong> (${escapeHtml(currentUser.role)})
              </span>
            </div>

            <!-- 1. 확인 및 다음 단계 승인 영역 -->
            <div class="bg-white border border-slate-200 rounded-xl p-3.5 space-y-2.5">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-blue-700">
                  다음 단계 진행: ${order.currentStep}단계(${escapeHtml(stage.name)}) → ${nextStage.step}단계(${escapeHtml(nextStage.name)})
                </span>
              </div>
              <input
                id="approveNoteInput"
                type="text"
                placeholder="확인 사항 또는 전달 메모 (선택 입력, 예: 검수 기준 충족 및 거래명세서 확인)"
                class="w-full px-3 py-2 text-xs sm:text-sm border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
              />
              <div>
                <div class="text-[11px] font-bold text-slate-600 mb-1">승인 증빙 사진/파일 첨부 (선택)</div>
                ${renderDropzoneHtml('approve', '검수 사진, 거래명세서, 세금계산서 등 첨부')}
              </div>
              <button
                type="button"
                onclick="handleApproveOrder('${escapeHtml(order.id)}')"
                class="w-full py-2.5 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-xs sm:text-sm font-bold shadow-xs transition cursor-pointer flex items-center justify-center gap-1.5"
              >
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
                </svg>
                확인 및 다음단계(${nextStage.step}단계 · ${escapeHtml(nextStage.name)})로 진행
              </button>
            </div>

            <!-- 2. 이전 단계 반려 영역 (2단계 이상일 때만 표시) -->
            ${
              order.currentStep >= 2
                ? `<div class="bg-rose-50/60 border border-rose-200 rounded-xl p-3.5 space-y-2.5">
                     <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2">
                       <label for="rejectTargetSelect" class="text-xs font-bold text-rose-700">
                         이전 단계로 반려 (반려 사유 필수)
                       </label>
                       <select
                         id="rejectTargetSelect"
                         class="text-xs font-semibold bg-white border border-rose-300 text-rose-800 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-rose-500/30"
                       >
                         ${prevStageOptions.join('')}
                       </select>
                     </div>
                     <textarea
                       id="rejectReasonInput"
                       rows="2"
                       placeholder="반려 사유를 반드시 입력해 주세요 (예: 납품 수량 불일치, 재가공 필요 등)"
                       class="w-full px-3 py-2 text-xs sm:text-sm bg-white border border-rose-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500/30 focus:border-rose-500"
                     ></textarea>
                     <div>
                       <div class="text-[11px] font-bold text-rose-700 mb-1">불량/수정 요청 증빙 사진·파일 첨부 (선택)</div>
                       ${renderDropzoneHtml('reject', '불량 부위 사진, 수정 요청 내역서 등 첨부')}
                     </div>
                     <p id="rejectErrorMsg" class="hidden text-xs font-semibold text-rose-600">
                       반려 사유를 입력해야 이전 단계로 되돌릴 수 있습니다.
                     </p>
                     <button
                       type="button"
                       onclick="handleRejectOrder('${escapeHtml(order.id)}')"
                       class="w-full py-2 px-4 rounded-xl bg-white hover:bg-rose-600 text-rose-700 hover:text-white border border-rose-300 hover:border-rose-600 text-xs sm:text-sm font-bold transition cursor-pointer flex items-center justify-center gap-1.5"
                     >
                       <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                         <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
                       </svg>
                       이전 단계로 반려
                     </button>
                   </div>`
                : `<p class="text-xs text-slate-400">1단계(발주)에서는 이전 단계가 없어 반려할 수 없습니다.</p>`
            }
          </div>
        `;
      } else {
        actionCardHtml = `
          <div class="bg-emerald-50/70 border border-emerald-200 rounded-2xl p-4 space-y-3">
            <div class="flex items-center gap-2 text-emerald-800">
              <svg class="w-5 h-5 text-emerald-600 shrink-0" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
              <div>
                <div class="text-sm font-bold">6단계(장부정리) 최종 완료된 건입니다</div>
                <div class="text-xs text-emerald-700">발주부터 장부정리까지 전 공정이 승인 완료되었습니다.</div>
              </div>
            </div>

            <div class="pt-2 border-t border-emerald-200/80 space-y-2">
              <div class="flex items-center justify-between gap-2">
                <span class="text-xs font-bold text-rose-700">정산/장부 수정이 필요한 경우 반려</span>
                <select id="rejectTargetSelect" class="text-xs font-semibold bg-white border border-rose-300 text-rose-800 rounded-lg px-2.5 py-1">
                  ${prevStageOptions.join('')}
                </select>
              </div>
              <textarea
                id="rejectReasonInput"
                rows="2"
                placeholder="장부 수정·재정산 사유를 입력해 주세요"
                class="w-full px-3 py-2 text-xs sm:text-sm bg-white border border-rose-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-rose-500/30"
              ></textarea>
              <div>
                ${renderDropzoneHtml('reject', '수정 요청 증빙 파일 첨부 (선택)')}
              </div>
              <p id="rejectErrorMsg" class="hidden text-xs font-semibold text-rose-600">
                반려 사유를 입력해야 이전 단계로 되돌릴 수 있습니다.
              </p>
              <button
                type="button"
                onclick="handleRejectOrder('${escapeHtml(order.id)}')"
                class="w-full py-2 px-4 rounded-xl bg-white hover:bg-rose-600 text-rose-700 hover:text-white border border-rose-300 text-xs font-bold transition cursor-pointer"
              >
                이전 단계로 반려
              </button>
            </div>
          </div>
        `;
      }

      const standaloneUploadHtml = `
        <div class="bg-white border border-slate-200 rounded-2xl p-4 space-y-2.5">
          <div class="flex items-center justify-between">
            <h3 class="text-xs sm:text-sm font-bold text-slate-800">
              현재 단계(${order.currentStep}단계 · ${escapeHtml(stage.name)}) 증빙 사진/파일 즉시 추가
            </h3>
            <span class="text-[11px] text-slate-400">단계 변경 없이 서류·현장사진만 추가</span>
          </div>
          <input
            id="standaloneNoteInput"
            type="text"
            placeholder="첨부 설명 메모 (선택, 예: 중간 공정 촬영 사진, 세금계산서 사본 추가)"
            class="w-full px-3 py-2 text-xs border border-slate-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500/30 focus:border-blue-500"
          />
          ${renderDropzoneHtml('standalone', '여기에 사진이나 파일을 끌어다 놓거나 선택하세요')}
          <div class="flex justify-end">
            <button
              type="button"
              onclick="handleStandaloneAttachment('${escapeHtml(order.id)}')"
              class="px-3.5 py-2 rounded-xl bg-slate-800 hover:bg-slate-900 text-white text-xs font-bold transition cursor-pointer"
            >
              현재 단계에 증빙 등록
            </button>
          </div>
        </div>
      `;

      const timelineHtml = order.logs
        .map((log, idx) => {
          const isLatest = idx === order.logs.length - 1;
          let actionBadge = '';
          let borderDot = 'bg-blue-600';

          if (log.action === 'CREATE') {
            actionBadge = `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-slate-200 text-slate-700">최초 등록</span>`;
            borderDot = 'bg-slate-600';
          } else if (log.action === 'APPROVE') {
            actionBadge = `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-blue-100 text-blue-700">승인 (APPROVE)</span>`;
            borderDot = 'bg-blue-600';
          } else if (log.action === 'REJECT') {
            actionBadge = `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-rose-100 text-rose-700">반려 (REJECT)</span>`;
            borderDot = 'bg-rose-600';
          } else if (log.action === 'ATTACH') {
            actionBadge = `<span class="text-[11px] font-bold px-2 py-0.5 rounded-full bg-teal-100 text-teal-800">증빙 첨부</span>`;
            borderDot = 'bg-teal-600';
          }

          const fromInfo = log.fromStep ? `${log.fromStep}단계(${escapeHtml(getStageInfo(log.fromStep).name)})` : '신규';
          const toInfo = `${log.toStep}단계(${escapeHtml(getStageInfo(log.toStep).name)})`;

          const logAtts = log.attachments || [];
          const logAttsHtml =
            logAtts.length > 0
              ? `<div class="pt-1.5 flex flex-wrap gap-2">
                  ${logAtts
                    .map((att) =>
                      att.isImage
                        ? `<button
                             type="button"
                             onclick="openAttachmentPreview('${escapeHtml(order.id)}', '${escapeHtml(att.id)}')"
                             class="group/att relative flex items-center gap-2 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-xl p-1.5 pr-2.5 text-left transition cursor-pointer"
                           >
                             <img src="${att.url}" alt="${escapeHtml(att.name)}" class="w-10 h-10 rounded-lg object-cover border border-slate-200 shrink-0" />
                             <div class="min-w-0 max-w-[160px]">
                               <div class="text-[11px] font-semibold text-slate-800 group-hover/att:text-blue-700 truncate">${escapeHtml(att.name)}</div>
                               <div class="text-[10px] text-slate-400">사진 미리보기 · ${formatFileSize(att.size)}</div>
                             </div>
                           </button>`
                        : `<button
                             type="button"
                             onclick="openAttachmentPreview('${escapeHtml(order.id)}', '${escapeHtml(att.id)}')"
                             class="group/att flex items-center gap-2 bg-slate-50 hover:bg-blue-50 border border-slate-200 hover:border-blue-300 rounded-xl px-2.5 py-1.5 text-left transition cursor-pointer"
                           >
                             <span class="w-7 h-7 rounded-lg bg-blue-100 text-blue-700 flex items-center justify-center text-[10px] font-bold shrink-0">DOC</span>
                             <div class="min-w-0 max-w-[170px]">
                               <div class="text-[11px] font-semibold text-slate-800 group-hover/att:text-blue-700 truncate">${escapeHtml(att.name)}</div>
                               <div class="text-[10px] text-slate-400">${formatFileSize(att.size)}</div>
                             </div>
                           </button>`
                    )
                    .join('')}
                </div>`
              : '';

          return `
            <div class="relative pl-6 pb-5 last:pb-0 border-l-2 ${
              log.action === 'REJECT' ? 'border-rose-300' : 'border-slate-200'
            } last:border-transparent">
              <span class="absolute -left-[7px] top-1 w-3 h-3 rounded-full ${borderDot} ring-4 ring-white"></span>
              <div class="bg-white border ${
                log.action === 'REJECT'
                  ? 'border-rose-200 bg-rose-50/30'
                  : isLatest
                  ? 'border-blue-200 bg-blue-50/20'
                  : 'border-slate-200'
              } rounded-xl p-3 space-y-1.5">
                <div class="flex items-center justify-between gap-2 flex-wrap">
                  <div class="flex items-center gap-1.5 flex-wrap">
                    ${actionBadge}
                    <span class="text-xs font-bold text-slate-800">
                      ${log.action === 'ATTACH' ? `${toInfo} 증빙 등록` : `${fromInfo} → ${toInfo}`}
                    </span>
                  </div>
                  <span class="text-[11px] font-mono text-slate-400">${escapeHtml(log.timestamp)}</span>
                </div>

                <div class="text-xs text-slate-600">
                  처리자: <strong class="text-slate-900">${escapeHtml(log.actorName)}</strong>
                  <span class="text-slate-400">(${escapeHtml(log.actorRole)})</span>
                </div>

                ${
                  log.note
                    ? `<p class="text-xs ${
                        log.action === 'REJECT' ? 'text-rose-800 font-medium' : 'text-slate-700'
                      } bg-slate-50 border border-slate-100 rounded-lg px-2.5 py-1.5">
                         ${log.action === 'REJECT' ? '반려 사유: ' : '메모: '}${escapeHtml(log.note)}
                       </p>`
                    : `<p class="text-[11px] text-slate-400 italic">입력된 메모 없음</p>`
                }
                ${logAttsHtml}
              </div>
            </div>
          `;
        })
        .join('');

      const allFilesGalleryHtml =
        allAttachments.length > 0
          ? `<div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
              ${allAttachments
                .map((att) => {
                  const st = getStageInfo(att.step);
                  return `
                    <div class="bg-white border border-slate-200 hover:border-blue-300 rounded-2xl p-3 flex flex-col justify-between gap-2.5 shadow-2xs transition">
                      <div
                        onclick="openAttachmentPreview('${escapeHtml(order.id)}', '${escapeHtml(att.id)}')"
                        class="cursor-pointer group"
                      >
                        ${
                          att.isImage
                            ? `<div class="w-full h-32 rounded-xl overflow-hidden bg-slate-100 border border-slate-200 mb-2.5">
                                 <img src="${att.url}" alt="${escapeHtml(att.name)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-200" />
                               </div>`
                            : `<div class="w-full h-24 rounded-xl bg-slate-50 border border-slate-200 mb-2.5 flex flex-col items-center justify-center text-blue-700">
                                 <svg class="w-7 h-7 mb-1" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
                                   <path stroke-linecap="round" stroke-linejoin="round" d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z" />
                                 </svg>
                                 <span class="text-[11px] font-bold">문서 파일</span>
                               </div>`
                        }
                        <div class="flex items-center gap-1.5 mb-1">
                          <span class="text-[10px] font-bold px-2 py-0.5 rounded-full ${st.badgeClass}">
                            ${att.step}단계 · ${escapeHtml(st.name)}
                          </span>
                          <span class="text-[11px] text-slate-400">${formatFileSize(att.size)}</span>
                        </div>
                        <div class="text-xs font-bold text-slate-900 group-hover:text-blue-700 truncate" title="${escapeHtml(att.name)}">
                          ${escapeHtml(att.name)}
                        </div>
                      </div>

                      <div class="pt-2 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-500">
                        <span>${escapeHtml(att.uploadedBy)} · ${escapeHtml(att.uploadedAt)}</span>
                        <button
                          type="button"
                          onclick="downloadAttachmentById('${escapeHtml(order.id)}', '${escapeHtml(att.id)}')"
                          class="font-bold text-blue-600 hover:text-blue-800 cursor-pointer"
                        >
                          다운로드
                        </button>
                      </div>
                    </div>
                  `;
                })
                .join('')}
            </div>`
          : `<div class="bg-slate-50 border border-dashed border-slate-300 rounded-2xl p-8 text-center text-xs text-slate-500">
               아직 첨부된 사진이나 문서 파일이 없습니다. 위 증빙 추가 영역이나 단계 승인·반려 시 파일을 업로드할 수 있습니다.
             </div>`;

      document.getElementById('drawerBody').innerHTML = `
        <!-- 기본 정보 카드 -->
        <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 bg-slate-50 border border-slate-200/80 rounded-2xl p-3.5 text-xs">
          <div>
            <span class="text-slate-400 block">거래처</span>
            <strong class="text-slate-800 text-sm">${escapeHtml(order.clientName)}</strong>
          </div>
          <div>
            <span class="text-slate-400 block">발주 금액</span>
            <strong class="text-slate-800 text-sm">${formatCurrency(order.amount)}</strong>
          </div>
          <div>
            <span class="text-slate-400 block">납기 희망일</span>
            <strong class="text-slate-800 text-sm">${escapeHtml(order.dueDate)}</strong>
          </div>
        </div>

        ${
          order.isRejectedReturn && order.lastRejectionReason
            ? `<div class="bg-rose-50 border border-rose-200 rounded-2xl p-3.5 text-xs text-rose-900">
                 <div class="font-bold text-rose-700 mb-1">반려 복귀 사유 안내</div>
                 <div>${escapeHtml(order.lastRejectionReason)}</div>
               </div>`
            : ''
        }

        <!-- 승인 / 반려 액션 영역 -->
        ${actionCardHtml}

        <!-- 현재 단계 단독 증빙 파일 추가 영역 -->
        ${standaloneUploadHtml}

        <!-- 상세 탭 전환: 승인·반려 타임라인 vs 전체 첨부파일 모아보기 -->
        <div class="space-y-3">
          <div class="flex items-center gap-2 border-b border-slate-200 pb-2">
            <button
              type="button"
              onclick="switchDrawerTab('timeline')"
              class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer ${
                state.drawerTab === 'timeline'
                  ? 'bg-blue-600 text-white shadow-2xs'
                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200/70'
              }"
            >
              단계별 승인·반려 타임라인 (${order.logs.length})
            </button>
            <button
              type="button"
              onclick="switchDrawerTab('files')"
              class="px-3.5 py-1.5 rounded-xl text-xs font-bold transition cursor-pointer inline-flex items-center gap-1.5 ${
                state.drawerTab === 'files'
                  ? 'bg-blue-600 text-white shadow-2xs'
                  : 'bg-slate-100 text-slate-600 hover:bg-slate-200/70'
              }"
            >
              <span>전체 첨부파일 모아보기</span>
              <span class="px-1.5 py-0.2 rounded-full text-[10px] ${
                state.drawerTab === 'files' ? 'bg-white/20 text-white' : 'bg-slate-200 text-slate-700'
              }">${allAttachments.length}</span>
            </button>
          </div>

          ${
            state.drawerTab === 'timeline'
              ? `<div class="pt-1">${timelineHtml}</div>`
              : `<div>${allFilesGalleryHtml}</div>`
          }
        </div>
      `;
    }

    function handleApproveOrder(orderId) {
      const order = state.orders.find((o) => o.id === orderId);
      if (!order || order.currentStep >= 6) return;

      const user = getCurrentUser();
      const noteInput = document.getElementById('approveNoteInput');
      const note = noteInput ? noteInput.value.trim() : '';

      const fromStep = order.currentStep;
      const toStep = order.currentStep + 1;
      const attachments = consumePendingFiles('approve', user, toStep);

      order.currentStep = toStep;
      order.isRejectedReturn = false;
      order.lastRejectionReason = '';

      order.logs.push({
        id: `log-${Date.now()}`,
        action: 'APPROVE',
        fromStep,
        toStep,
        actorName: user.name,
        actorRole: user.role,
        timestamp: formatNowTimestamp(),
        note: note || `${toStep}단계(${getStageInfo(toStep).name}) 확인 및 승인 완료`,
        attachments,
      });

      renderAll();
      showToast(`${order.orderNo} · ${toStep}단계(${getStageInfo(toStep).name})로 승인되었습니다.`, 'success');
    }

    function handleRejectOrder(orderId) {
      const order = state.orders.find((o) => o.id === orderId);
      if (!order || order.currentStep <= 1) return;

      const reasonInput = document.getElementById('rejectReasonInput');
      const errorMsg = document.getElementById('rejectErrorMsg');
      const targetSelect = document.getElementById('rejectTargetSelect');

      const reason = reasonInput ? reasonInput.value.trim() : '';
      if (!reason) {
        if (errorMsg) errorMsg.classList.remove('hidden');
        if (reasonInput) {
          reasonInput.focus();
          reasonInput.classList.add('ring-2', 'ring-rose-500');
        }
        return;
      }

      if (errorMsg) errorMsg.classList.add('hidden');

      const user = getCurrentUser();
      const fromStep = order.currentStep;
      const toStep = targetSelect ? Number(targetSelect.value) : Math.max(1, fromStep - 1);
      const attachments = consumePendingFiles('reject', user, toStep);

      order.currentStep = toStep;
      order.isRejectedReturn = true;
      order.lastRejectionReason = reason;

      order.logs.push({
        id: `log-${Date.now()}`,
        action: 'REJECT',
        fromStep,
        toStep,
        actorName: user.name,
        actorRole: user.role,
        timestamp: formatNowTimestamp(),
        note: reason,
        attachments,
      });

      renderAll();
      showToast(
        `${order.orderNo} · ${toStep}단계(${getStageInfo(toStep).name})로 반려되었습니다.`,
        'warn'
      );
    }

    function handleStandaloneAttachment(orderId) {
      const order = state.orders.find((o) => o.id === orderId);
      if (!order) return;

      if (!state.pendingFiles.standalone || state.pendingFiles.standalone.length === 0) {
        showToast('먼저 첨부할 사진이나 파일을 선택해 주세요.', 'warn');
        return;
      }

      const user = getCurrentUser();
      const noteInput = document.getElementById('standaloneNoteInput');
      const note = noteInput ? noteInput.value.trim() : '';
      const attachments = consumePendingFiles('standalone', user, order.currentStep);

      order.logs.push({
        id: `log-${Date.now()}`,
        action: 'ATTACH',
        fromStep: order.currentStep,
        toStep: order.currentStep,
        actorName: user.name,
        actorRole: user.role,
        timestamp: formatNowTimestamp(),
        note: note || `${order.currentStep}단계(${getStageInfo(order.currentStep).name}) 증빙 파일 ${attachments.length}건 추가`,
        attachments,
      });

      renderAll();
      showToast(`${order.orderNo} · 현재 단계 증빙 파일 ${attachments.length}건이 등록되었습니다.`, 'success');
    }

    /**
     * =========================================================================
     * 6. 새 발주 등록 모달 제어
     * =========================================================================
     */
    function openNewOrderModal() {
      const modal = document.getElementById('newOrderModal');
      document.getElementById('newOrderForm').reset();
      document.getElementById('newDueDate').value = getDefaultFutureDate(7);
      state.pendingFiles.newOrder = [];
      refreshDropzone('newOrder');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      document.getElementById('newClientName').focus();
    }

    function closeNewOrderModal() {
      const modal = document.getElementById('newOrderModal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function submitNewOrder(event) {
      event.preventDefault();
      const clientName = document.getElementById('newClientName').value.trim();
      const itemSummary = document.getElementById('newItemSummary').value.trim();
      const amount = Number(document.getElementById('newAmount').value || 0);
      const dueDate = document.getElementById('newDueDate').value;
      const note = document.getElementById('newNote').value.trim();

      if (!clientName || !itemSummary) return;

      const user = getCurrentUser();
      const seq = String(state.orders.length + 1).padStart(2, '0');
      const todayCompact = new Date().toISOString().slice(0, 10).replace(/-/g, '');
      const attachments = consumePendingFiles('newOrder', user, 1);

      const newOrder = {
        id: `ord-${Date.now()}`,
        orderNo: `ORD-${todayCompact}-${seq}`,
        clientName,
        itemSummary,
        amount,
        currentStep: 1,
        dueDate,
        isRejectedReturn: false,
        lastRejectionReason: '',
        logs: [
          {
            id: `log-${Date.now()}`,
            action: 'CREATE',
            fromStep: null,
            toStep: 1,
            actorName: user.name,
            actorRole: user.role,
            timestamp: formatNowTimestamp(),
            note: note || '신규 발주 등록',
            attachments,
          },
        ],
      };

      state.orders.unshift(newOrder);
      closeNewOrderModal();
      renderAll();
      showToast(`새 발주(${newOrder.orderNo})가 1단계(발주)로 등록되었습니다.`, 'success');
    }

    /**
     * =========================================================================
     * 7. 필터 및 검색 이벤트 핸들러
     * =========================================================================
     */
    function selectStageFilter(step) {
      state.selectedStep = state.selectedStep === step ? 'ALL' : step;
      renderAll();
    }

    function handleSearchInput(val) {
      state.searchQuery = val;
      renderOrderList();
    }

    function toggleRejectedOnly() {
      state.rejectedOnly = !state.rejectedOnly;
      const btn = document.getElementById('rejectedOnlyToggle');
      if (state.rejectedOnly) {
        btn.classList.remove('bg-white', 'text-slate-700', 'border-slate-200');
        btn.classList.add('bg-rose-600', 'text-white', 'border-rose-600');
      } else {
        btn.classList.add('bg-white', 'text-slate-700', 'border-slate-200');
        btn.classList.remove('bg-rose-600', 'text-white', 'border-rose-600');
      }
      renderOrderList();
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        const lightbox = document.getElementById('lightboxModal');
        if (!lightbox.classList.contains('hidden')) {
          closeLightbox();
          return;
        }
        const userModal = document.getElementById('userManageModal');
        if (!userModal.classList.contains('hidden')) {
          closeUserModal();
          return;
        }
        closeNewOrderModal();
        closeDetailDrawer();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      renderUserSelector();
      renderAll();
    });
  </script>
</body>
</html>
